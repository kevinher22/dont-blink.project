<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-01" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0c1a2e" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <radialGradient id="exit-glow" cx="85%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="glow-01">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep cyber corridor backdrop -->
  <rect width="800" height="450" fill="url(#bg-01)" />

  <!-- Distant exit doorway light beam -->
  <polygon points="680,180 800,120 800,380 680,340" fill="url(#exit-glow)" />
  <rect x="680" y="200" width="120" height="130" fill="#e0f2fe" opacity="0.85" filter="url(#glow-01)" />

  <!-- Perspective Floor Grid receding to exit -->
  <path d="M 0 340 L 680 330 M 0 380 L 680 335 M 0 420 L 680 340 M 0 450 L 680 345" stroke="#0ea5e9" stroke-opacity="0.25" stroke-width="1.5" />
  <line x1="100" y1="340" x2="80" y2="450" stroke="#0ea5e9" stroke-opacity="0.2" />
  <line x1="250" y1="337" x2="220" y2="450" stroke="#0ea5e9" stroke-opacity="0.2" />
  <line x1="420" y1="334" x2="390" y2="450" stroke="#0ea5e9" stroke-opacity="0.2" />
  <line x1="560" y1="332" x2="540" y2="450" stroke="#0ea5e9" stroke-opacity="0.2" />

  <!-- Exhausted Runner Silhouette reaching the dawn threshold -->
  <g transform="translate(540, 270)">
    <!-- Runner Shadow on ground -->
    <ellipse cx="20" cy="55" rx="35" ry="6" fill="#000000" opacity="0.6" />
    <!-- Character body in heavy breath/exhausted posture leaning forward -->
    <path d="M 12 18 L 18 36 L 24 54" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
    <path d="M 16 36 L 6 52" stroke="#0284c7" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 12 14 Q 18 10 24 16 L 26 32 Q 18 34 10 28 Z" fill="#0369a1" />
    <circle cx="18" cy="8" r="8" fill="#0284c7" />
    <circle cx="21" cy="7" r="3" fill="#38bdf8" filter="url(#glow-01)" />
    <!-- Arm supporting knee in exhaustion -->
    <path d="M 14 18 L 22 28 L 24 38" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Far behind in deep shadow: Faint ominous silhouette barely visible -->
  <g transform="translate(90, 260)" opacity="0.45">
    <ellipse cx="0" cy="55" rx="28" ry="5" fill="#000" opacity="0.4" />
    <path d="M -10 50 Q -15 20 -6 0 Q 0 -12 8 0 Q 18 20 12 50 Z" fill="#030712" />
    <circle cx="-1" cy="6" r="1.5" fill="#ef4444" opacity="0.75" />
    <circle cx="4" cy="6" r="1.5" fill="#ef4444" opacity="0.75" />
  </g>

  <!-- Atmospheric mist fog layers -->
  <path d="M 0 350 Q 200 330 400 355 Q 600 380 800 345 L 800 450 L 0 450 Z" fill="#0284c7" opacity="0.08" />
  <path d="M 0 380 Q 250 360 500 390 Q 750 370 800 385 L 800 450 L 0 450 Z" fill="#0f172a" opacity="0.3" />

  <!-- Ending Badge Overlay -->
  <text x="40" y="55" fill="#38bdf8" font-family="'Chakra Petch', monospace" font-size="14" letter-spacing="4">ENDING 01 // THE ESCAPE</text>
  <text x="40" y="80" fill="#94a3b8" font-family="sans-serif" font-size="12">"Akhirnya aku berhasil keluar... kan?"</text>
</svg>
