<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-04" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090214" />
      <stop offset="50%" stop-color="#1b072b" />
      <stop offset="100%" stop-color="#020005" />
    </linearGradient>
    <radialGradient id="corruption-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#7e22ce" stop-opacity="0.4" />
      <stop offset="80%" stop-color="#3b0764" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-04)" />
  <circle cx="400" cy="225" r="260" fill="url(#corruption-glow)" />

  <!-- Floor Grid in Dark Purple -->
  <path d="M 0 350 L 800 350 M 0 385 L 800 385 M 0 425 L 800 425" stroke="#9333ea" stroke-opacity="0.3" stroke-width="1.5" />
  <line x1="400" y1="350" x2="400" y2="450" stroke="#a855f7" stroke-opacity="0.4" />
  <line x1="250" y1="350" x2="180" y2="450" stroke="#9333ea" stroke-opacity="0.25" />
  <line x1="550" y1="350" x2="620" y2="450" stroke="#9333ea" stroke-opacity="0.25" />

  <!-- The Merging Silhouettes: Player standing still as the Entity converges -->
  <g transform="translate(370, 210)">
    <!-- Converging aura shadows -->
    <ellipse cx="30" cy="135" rx="55" ry="10" fill="#000" opacity="0.9" />
    <!-- Outer Entity form cloaking around the player -->
    <path d="M 30 0 C 75 30 90 90 65 130 C 50 140 10 140 -5 130 C -30 90 -15 30 30 0 Z" fill="#0b0217" opacity="0.9" />
    <path d="M 30 15 C 60 40 70 85 50 120 C 40 130 20 130 10 120 C -10 85 0 40 30 15 Z" fill="#3b0764" opacity="0.75" />
    <!-- Inner Player armor glowing with violet cyber corruption veins -->
    <rect x="18" y="55" width="24" height="45" rx="8" fill="#581c87" />
    <circle cx="30" cy="38" r="14" fill="#6b21a8" />
    <!-- Glowing Visor shifting into dual crimson/violet eyes -->
    <ellipse cx="26" cy="36" rx="4" ry="2.5" fill="#f43f5e" />
    <ellipse cx="34" cy="36" rx="4" ry="2.5" fill="#f43f5e" />
    <!-- Tendrils fusing -->
    <path d="M 2 80 Q 20 70 38 80 Q 56 90 68 85" stroke="#c084fc" stroke-width="2" fill="none" opacity="0.7" />
  </g>

  <text x="40" y="55" fill="#c084fc" font-family="'Chakra Petch', monospace" font-size="14" letter-spacing="4">ENDING 04 // THE THING</text>
  <text x="40" y="80" fill="#e2e8f0" font-family="sans-serif" font-size="12">"Aku berhenti takut. Dan entah kenapa... dia juga berhenti mengejarku."</text>
</svg>
