<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-final" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020307" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>
    <radialGradient id="starlight-convergence" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="55%" stop-color="#a855f7" stop-opacity="0.4" />
      <stop offset="85%" stop-color="#0f172a" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="hyper-glow">
      <feGaussianBlur stdDeviation="10" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-final)" />
  <circle cx="400" cy="200" r="300" fill="url(#starlight-convergence)" />

  <!-- 7 Orbiting Runes / Ending Seals representing the 7 conquered endings -->
  <g stroke="#38bdf8" stroke-width="1.5" fill="#0284c7" opacity="0.6">
    <circle cx="160" cy="120" r="16" />
    <circle cx="240" cy="80" r="16" />
    <circle cx="340" cy="60" r="16" />
    <circle cx="460" cy="60" r="16" />
    <circle cx="560" cy="80" r="16" />
    <circle cx="640" cy="120" r="16" />
    <circle cx="400" cy="330" r="16" />
  </g>
  <g fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">
    <text x="160" y="124">01</text>
    <text x="240" y="84">02</text>
    <text x="340" y="64">03</text>
    <text x="460" y="64">04</text>
    <text x="560" y="84">05</text>
    <text x="640" y="124">06</text>
    <text x="400" y="334">07</text>
  </g>

  <!-- Player and Entity standing side by side in transcendent unity -->
  <g transform="translate(330, 210)">
    <ellipse cx="20" cy="115" rx="25" ry="5" fill="#000" opacity="0.7" />
    <path d="M 12 35 L 20 20 L 28 35 L 26 85 L 14 85 Z" fill="#0284c7" />
    <circle cx="20" cy="10" r="12" fill="#0369a1" />
    <ellipse cx="22" cy="10" rx="5" ry="3" fill="#38bdf8" filter="url(#hyper-glow)" />
  </g>

  <g transform="translate(430, 190)">
    <ellipse cx="25" cy="135" rx="30" ry="6" fill="#000" opacity="0.7" />
    <path d="M 25 0 C 50 30 55 85 40 120 C 30 130 15 130 5 120 C -10 85 -5 30 25 0 Z" fill="#030712" />
    <circle cx="20" cy="25" r="3" fill="#38bdf8" filter="url(#hyper-glow)" />
    <circle cx="30" cy="25" r="3" fill="#38bdf8" filter="url(#hyper-glow)" />
  </g>

  <!-- Pillars of ascending light dissolving into cosmos -->
  <g stroke="#ffffff" stroke-width="1.5" opacity="0.35" stroke-dasharray="6 8">
    <line x1="350" y1="230" x2="350" y2="20" />
    <line x1="455" y1="210" x2="455" y2="20" />
  </g>

  <text x="400" y="380" fill="#ffffff" font-family="'Chakra Petch', monospace" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="6">DON'T BLINK</text>
  <text x="400" y="405" fill="#93c5fd" font-family="'Chakra Petch', monospace" font-size="12" text-anchor="middle" letter-spacing="4">THE STORY CONTINUES...</text>
</svg>
