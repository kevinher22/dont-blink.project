<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-07" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <radialGradient id="aurora" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#a855f7" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="gold-glow">
      <feGaussianBlur stdDeviation="8" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-07)" />
  <circle cx="400" cy="220" r="280" fill="url(#aurora)" />

  <!-- Luminous Ground Matrix -->
  <path d="M 0 350 L 800 350 M 0 385 L 800 385 M 0 425 L 800 425" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
  <line x1="400" y1="350" x2="400" y2="450" stroke="#f59e0b" stroke-opacity="0.5" />
  <line x1="260" y1="350" x2="180" y2="450" stroke="#38bdf8" stroke-opacity="0.3" />
  <line x1="540" y1="350" x2="620" y2="450" stroke="#38bdf8" stroke-opacity="0.3" />

  <!-- The Climax: Player and Entity Face Each Other In Mutual Understanding -->
  <!-- The Player on the Left -->
  <g transform="translate(300, 250)">
    <ellipse cx="20" cy="90" rx="30" ry="6" fill="#000" opacity="0.7" />
    <path d="M 10 35 L 20 20 L 30 35 L 28 75 L 12 75 Z" fill="#0284c7" />
    <circle cx="20" cy="10" r="12" fill="#0369a1" />
    <!-- Visor shining clear cyan -->
    <ellipse cx="25" cy="10" rx="6" ry="3" fill="#38bdf8" filter="url(#gold-glow)" />
    <!-- Extended Hand towards Entity -->
    <path d="M 28 45 L 60 48" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- The Entity on the Right -->
  <g transform="translate(460, 220)">
    <ellipse cx="30" cy="120" rx="40" ry="7" fill="#000" opacity="0.8" />
    <path d="M 30 0 C 65 30 75 80 55 120 C 40 130 10 130 0 120 C -20 80 -10 30 30 0 Z" fill="#030712" />
    <!-- Gentle crimson-gold eyes -->
    <circle cx="22" cy="30" r="3.5" fill="#f59e0b" filter="url(#gold-glow)" />
    <circle cx="34" cy="30" r="3.5" fill="#f59e0b" filter="url(#gold-glow)" />
    <!-- Extended Hand matching Player -->
    <path d="M 5 65 L -35 68" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Golden spark where their fingers nearly meet -->
  <circle cx="395" cy="292" r="5" fill="#ffffff" filter="url(#gold-glow)" />
  <circle cx="395" cy="292" r="18" fill="#f59e0b" opacity="0.4" />

  <!-- Story Clues Floating in Sacred Stillness -->
  <g fill="#93c5fd" opacity="0.6" font-family="monospace" font-size="10">
    <text x="180" y="160">MEMORIES RESTORED</text>
    <text x="520" y="160">CYCLE COMPLETED</text>
  </g>

  <text x="40" y="55" fill="#f59e0b" font-family="'Chakra Petch', monospace" font-size="14" letter-spacing="4">ENDING 07 // DON'T BLINK (TRUE ENDING)</text>
  <text x="40" y="80" fill="#fef08a" font-family="sans-serif" font-size="12">"Jadi selama ini... aku bukan sedang melarikan diri darinya."</text>
</svg>
