<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-03" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180005" />
      <stop offset="50%" stop-color="#05010a" />
      <stop offset="100%" stop-color="#2a040b" />
    </linearGradient>
    <radialGradient id="glitch-core" cx="60%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#7f1d1d" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="distort-03">
      <feTurbulence type="fractalNoise" baseFrequency="0.04 0.95" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <!-- Glitched crimson darkness backdrop -->
  <rect width="800" height="450" fill="url(#bg-03)" />
  <circle cx="480" cy="200" r="280" fill="url(#glitch-core)" />

  <!-- Horizontal Chromatic Aberration & Glitch Strips -->
  <rect x="0" y="80" width="800" height="14" fill="#ef4444" opacity="0.25" />
  <rect x="0" y="190" width="800" height="24" fill="#06b6d4" opacity="0.15" />
  <rect x="0" y="270" width="800" height="16" fill="#dc2626" opacity="0.3" />
  <rect x="0" y="360" width="800" height="8" fill="#f43f5e" opacity="0.2" />

  <!-- Distorted Ground Grid -->
  <g stroke="#dc2626" stroke-opacity="0.4" stroke-width="1.5">
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="0" y1="390" x2="800" y2="390" />
    <line x1="0" y1="430" x2="800" y2="430" />
    <line x1="200" y1="360" x2="160" y2="450" />
    <line x1="380" y1="360" x2="350" y2="450" />
    <line x1="560" y1="360" x2="550" y2="450" />
  </g>

  <!-- Player in mid-turn (Looking back in horror) -->
  <g transform="translate(240, 265)">
    <ellipse cx="20" cy="80" rx="30" ry="6" fill="#000" opacity="0.8" />
    <!-- Body twisted backwards towards the entity -->
    <path d="M 10 30 Q 18 20 28 32 L 25 58 Q 18 64 8 58 Z" fill="#0284c7" />
    <!-- Helmet rotated left facing camera/behind -->
    <circle cx="16" cy="14" r="14" fill="#0369a1" />
    <rect x="6" y="10" width="16" height="8" rx="3" fill="#38bdf8" />
    <!-- Trembling hands reaching back -->
    <path d="M 8 36 L -2 46 L 6 56" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Massive Looming Entity right behind the player -->
  <g transform="translate(420, 100)" filter="url(#distort-03)">
    <!-- Ominous towering silhouette with jagged shadowy shroud -->
    <path d="M 40 260 C -30 180 -10 60 50 0 C 110 60 130 180 60 260 Z" fill="#050005" />
    <path d="M 50 250 C 0 160 15 50 50 15 C 85 50 100 160 50 250 Z" fill="#1f0207" opacity="0.9" />
    <!-- Glaring menacing crimson pupils -->
    <ellipse cx="36" cy="65" rx="7" ry="4" fill="#ef4444" />
    <ellipse cx="64" cy="65" rx="7" ry="4" fill="#ef4444" />
    <circle cx="36" cy="65" r="2.5" fill="#ffffff" />
    <circle cx="64" cy="65" r="2.5" fill="#ffffff" />
  </g>

  <text x="40" y="55" fill="#ef4444" font-family="'Chakra Petch', monospace" font-size="14" letter-spacing="4">ENDING 03 // YOU BLINKED</text>
  <text x="40" y="80" fill="#cbd5e1" font-family="sans-serif" font-size="12">"Seharusnya aku nggak melihat ke belakang..."</text>
</svg>
